<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131d">
<title>School Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0d1018;--panel:#171c29;--panel2:#202738;--line:#2b3448;--text:#f2f5fc;--muted:#9aa6bd;--accent:#9b8cff;--blue:#71b7ff;--green:#65d6ad;--orange:#ffbf69;--red:#ff7e8b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% -10%,#242344 0,transparent 40%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#111321;font-weight:700}
button.secondary{background:#293248;color:var(--text);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:#492832;color:#ffdce1}
input,textarea,select{width:100%;background:#101522;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;outline:none}textarea{min-height:90px;resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 6px}
.app{max-width:1050px;margin:auto;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 16px;gap:12px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#a18cff,#64c7ff);display:grid;place-items:center;color:#10131d;font-size:22px;font-weight:900}
h1{font-size:21px;margin:0} .sub{color:var(--muted);font-size:12px;margin-top:3px}
.header-actions{display:flex;gap:8px}.iconbtn{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px}
.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 14px;scrollbar-width:none}.tabs button{white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 13px}.tabs button.active{background:#292442;color:#e9e3ff;border-color:#51477c}
main{display:grid;gap:14px}.hero{background:linear-gradient(120deg,#282344,#1b2a3b);border:1px solid #3c3b60;border-radius:20px;padding:19px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero h2{margin:0 0 6px;font-size:20px}.hero p{margin:0;color:#c1c5d9;font-size:13px;line-height:1.5}.hero .spark{font-size:38px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;min-width:0}.card h3{font-size:14px;margin:0 0 12px}.metric{font-size:27px;font-weight:800;letter-spacing:-1px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.subject-list{display:grid;gap:9px}.subject{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;background:#111725}.subject .emoji{font-size:20px}.subject .name{flex:1;font-weight:650}.grade{font-weight:800;color:var(--green)}
.progress{height:6px;border-radius:20px;background:#30384a;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:20px}
.list{display:grid;gap:9px}.item{background:#111725;border:1px solid #293247;border-radius:13px;padding:12px}.item h4{margin:0 0 5px;font-size:14px}.item p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#2a2942;color:#c9c0ff;font-size:11px;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:13px;padding:9px 11px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 2px}.section-title h2{font-size:18px;margin:0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.full{grid-column:1/-1}
.empty{padding:22px;text-align:center;color:var(--muted);background:#111725;border:1px dashed var(--line);border-radius:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111520ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px;z-index:5}
.nav button{background:transparent;color:var(--muted);font-size:11px;padding:7px 11px;min-width:55px}.nav button b{display:block;font-size:19px;margin-bottom:2px}.nav button.active{color:#c9c0ff}
.modal{position:fixed;inset:0;background:#05070bcc;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}.modal.show{display:flex}.sheet{background:#171c29;border:1px solid var(--line);border-radius:20px 20px 15px 15px;padding:18px;width:min(650px,100%);max-height:88vh;overflow:auto}.sheet h2{margin:0 0 8px}.close{float:right;background:#293248;color:white;padding:7px 10px}
.filebox{border:1px dashed #59617a;border-radius:14px;padding:16px;text-align:center;background:#111725}.filebox input{border:0;padding:8px;margin-top:8px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#111725;border-radius:9px;min-height:64px;padding:7px 4px;font-size:11px;color:var(--muted)}.day strong{display:block;color:var(--text);font-size:12px}.day.today{outline:1px solid var(--accent)}.dot{width:5px;height:5px;background:var(--orange);border-radius:50%;display:inline-block;margin:2px}
footer{text-align:center;color:#68738a;font-size:11px;padding:18px 0}
@media(min-width:720px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wide{grid-column:span 2}.nav{position:sticky;bottom:0;border:1px solid var(--line);border-radius:16px;margin:20px auto 0;max-width:700px}.app{padding-bottom:20px}.hero{padding:24px}}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.hero h2{font-size:18px}.nav button{min-width:0;padding:7px 8px}}

.streakbar{display:flex;align-items:center;gap:12px;background:linear-gradient(110deg,#382b24,#30283e);border:1px solid #61483c;border-radius:16px;padding:13px;margin-top:12px}
.flame{font-size:30px}.xpbar{height:7px;background:#4a4050;border-radius:20px;overflow:hidden;margin-top:6px}.xpbar span{display:block;height:100%;background:linear-gradient(90deg,#ffad62,#ffe18a)}
.badgegrid{display:flex;gap:8px;flex-wrap:wrap}.achievement{padding:9px 11px;border-radius:12px;background:#242b3b;border:1px solid #3a455c;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">✦</div><div><h1>School Hub</h1><div class="sub">Your school life, organized.</div></div></div><div class="header-actions"><button class="iconbtn" id="notifyBtn" title="Enable notifications">♧</button></div></header>
<div class="tabs" id="tabs">
<button class="active" data-page="home">Overview</button><button data-page="grades">Grades</button><button data-page="assignments">Assignments</button><button data-page="notes">Notes</button><button data-page="calendar">Calendar</button><button data-page="assistant">AI Helper</button>
</div>
<main id="main"></main>
<footer>School Hub saves your information on this device. Check your school portal for official grades and due dates.</footer>
</div>
<div class="nav" id="bottomNav">
<button class="active" data-page="home"><b>⌂</b>Home</button><button data-page="grades"><b>▤</b>Grades</button><button data-page="assignments"><b>✓</b>Tasks</button><button data-page="calendar"><b>▦</b>Calendar</button><button data-page="assistant"><b>✧</b>AI Help</button>
</div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<script>
const subjects=[["ELA","📖"],["Math","➗"],["German","🇩🇪"],["Social Studies","🌎"],["Science","🔬"]];
const $=s=>document.querySelector(s);
let data=JSON.parse(localStorage.getItem("schoolhub_v1")||"null")||{grades:{},tasks:[],notes:[],xp:0,streak:0,lastWorkDay:"",bestStreak:0,workDays:[]};
let page="home", month=new Date().getMonth(), year=new Date().getFullYear();
function save(){localStorage.setItem("schoolhub_v1",JSON.stringify(data));}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function setPage(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render();}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
function gradeVal(s){return data.grades[s]?.grade||"—";}
function upcoming(){return data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));}
function render(){
 const m=$("#main");
 if(page==="home"){m.innerHTML=`<section class="hero"><div><h2>Make today count.</h2><p>Keep your classes, assignments, and notes in one calm place. Add your grades to get started.</p><div class="actions"><button onclick="setPage('assignments')">＋ Add assignment</button><button class="secondary" onclick="setPage('grades')">Update grades</button></div></div><div class="spark">✦</div></section>
 <div class="streakbar"><div class="flame">🔥</div><div style="flex:1"><div class="row"><b>${data.streak||0} day streak</b><b>${data.xp||0} XP</b></div><div class="small" style="color:#d3bfd0">Complete an assignment to keep your streak going.</div><div class="xpbar"><span style="width:${(data.xp||0)%100}%"></span></div></div><div style="font-size:22px">🏆</div></div>
 <div class="grid"><div class="card"><div class="muted small">OPEN ASSIGNMENTS</div><div class="metric">${upcoming().length}</div><div class="small muted">Not marked complete</div></div><div class="card"><div class="muted small">SAVED NOTES</div><div class="metric">${data.notes.length}</div><div class="small muted">Across your classes</div></div><div class="card"><div class="muted small">CLASSES</div><div class="metric">5</div><div class="small muted">Your school subjects</div></div><div class="card"><div class="muted small">NEXT DUE</div><div class="metric" style="font-size:17px">${upcoming()[0]?.due?new Date(upcoming()[0].due+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}):"—"}</div><div class="small muted">${upcoming()[0]?esc(upcoming()[0].title):"Nothing scheduled"}</div></div></div>
 <div class="grid"><div class="card wide"><div class="row"><h3>Your classes</h3><button class="ghost" onclick="setPage('grades')">Edit grades</button></div><div class="subject-list">${subjects.map(([s,e])=>`<div class="subject"><span class="emoji">${e}</span><span class="name">${s}</span><span class="grade">${esc(gradeVal(s))}</span></div>`).join("")}</div></div><div class="card wide"><div class="row"><h3>Coming up</h3><button class="ghost" onclick="setPage('assignments')">See all</button></div>${upcoming().slice(0,4).map(taskCard).join("")||'<div class="empty">No assignments yet. Add one when your teacher gives it to you.</div>'}</div></div><div class="card"><h3>Achievements</h3><div class="badgegrid"><span class="achievement">🌱 First task</span><span class="achievement">🔥 3-day streak</span><span class="achievement">⚡ 100 XP</span><span class="achievement">🏅 7-day streak</span></div><p class="muted small" style="margin-bottom:0">Earn 20 XP each time you complete an assignment. Your streak grows on days you finish at least one task.</p></div>`}
 if(page==="grades"){m.innerHTML=`<div class="section-title"><h2>Grade book</h2><button onclick="openGrade()">＋ Add grade</button></div><div class="card"><p class="muted small">Enter the grade shown in your school portal. You can update it whenever it changes.</p><div class="subject-list">${subjects.map(([s,e])=>`<div class="subject"><span class="emoji">${e}</span><span class="name">${s}</span><span class="grade">${esc(gradeVal(s))}</span><button class="secondary" onclick="openGrade('${s}')">Edit</button></div>`).join("")}</div></div><div class="card"><h3>Import a grade screenshot</h3><p class="muted small">Choose a screenshot from your device. It will appear here so you can review it and enter the grades. This starter app does not automatically read text from the image yet.</p><div class="filebox">📷 Select a screenshot<input type="file" id="gradeImage" accept="image/*"></div><div id="imagePreview"></div></div>`;$("#gradeImage").addEventListener("change",previewImage)}
 if(page==="assignments"){m.innerHTML=`<div class="section-title"><h2>Assignment book</h2><button onclick="openTask()">＋ Add task</button></div><div class="card"><div class="row"><span class="muted small">YOUR TASKS</span><span class="muted small">${data.tasks.filter(t=>t.done).length} completed</span></div><div class="list" style="margin-top:12px">${data.tasks.length?data.tasks.slice().sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")).map(taskCard).join(""):'<div class="empty">Your assignment book is empty. Add homework, projects, and tests here.</div>'}</div></div>`}
 if(page==="notes"){m.innerHTML=`<div class="section-title"><h2>Class notes</h2><button onclick="openNote()">＋ New note</button></div><div class="list">${data.notes.length?data.notes.slice().reverse().map((n,i)=>`<div class="card"><div class="row"><h3>${esc(n.title)}</h3><button class="ghost" onclick="deleteNote(${data.notes.length-1-i})">Delete</button></div><div class="pill">${esc(n.subject)}</div><p style="white-space:pre-wrap;line-height:1.5">${esc(n.body)}</p></div>`).join(""):'<div class="empty">Keep class notes, study guides, and reminders here.</div>'}</div>`}
 if(page==="calendar"){let first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=first.getDay();let cells=Array(offset).fill('<div></div>');for(let d=1;d<=days;d++){let iso=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,tasks=data.tasks.filter(t=>t.due===iso);cells.push(`<div class="day ${new Date().toDateString()===new Date(year,month,d).toDateString()?'today':''}"><strong>${d}</strong>${tasks.map(t=>`<span class="dot" title="${esc(t.title)}"></span>`).join("")}</div>`)}m.innerHTML=`<div class="section-title"><h2>Calendar</h2><div><button class="secondary" onclick="changeMonth(-1)">‹</button> <button class="secondary" onclick="changeMonth(1)">›</button></div></div><div class="card"><div class="row" style="margin-bottom:14px"><b>${new Date(year,month).toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><span class="muted small">Dots = assignments</span></div><div class="calendar">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="muted small" style="text-align:center">${x}</div>`).join("")}${cells.join("")}</div></div><div class="card"><h3>Assignments this month</h3>${data.tasks.filter(t=>t.due?.startsWith(`${year}-${String(month+1).padStart(2,"0")}`)).map(taskCard).join("")||'<div class="empty">No due dates this month.</div>'}</div>`}
 if(page==="assistant"){m.innerHTML=`<div class="hero"><div><h2>AI School Helper ✦</h2><p>Ask for help organizing your schoolwork. This starter version uses your saved tasks and grades for simple planning suggestions.</p></div><div class="spark">🤖</div></div><div class="card"><h3>Try asking</h3><div class="actions">${["What should I work on first?","What assignments are coming up?","Help me plan my week","Show me my grades"].map(q=>`<button class="secondary" onclick="ask('${q}')">${q}</button>`).join("")}</div><label>Your question</label><textarea id="question" placeholder="Example: Help me plan my homework for tonight..."></textarea><div class="actions"><button onclick="ask()">Ask School Helper</button></div><div id="answer" style="margin-top:14px"></div></div><div class="card"><h3>Connect an AI service</h3><p class="muted small">A secure server endpoint can connect this app to a real AI model. Do not paste an API key into this app. The endpoint must keep its secret key on the server and accept a POST request with a JSON body containing <code>message</code>, <code>grades</code>, and <code>assignments</code>.</p><label>Secure AI endpoint URL (optional)</label><input id="aiEndpoint" placeholder="https://your-server.example/api/school-helper" value="${esc(localStorage.getItem('schoolhub_ai_endpoint')||'')}"><div class="actions"><button class="secondary" onclick="saveAIEndpoint()">Save endpoint</button></div></div>`}
}
function taskCard(t){let idx=data.tasks.indexOf(t);return `<div class="item"><div class="row"><h4 style="${t.done?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}</h4><input type="checkbox" style="width:19px;height:19px;accent-color:#9b8cff" ${t.done?'checked':''} onchange="toggleTask(${idx},this.checked)"></div><p>${esc(t.subject)}${t.due?' · Due '+new Date(t.due+'T12:00:00').toLocaleDateString():" · No due date"}</p>${t.details?`<p style="margin-top:5px">${esc(t.details)}</p>`:""}<div class="row"><span class="pill">${t.done?'Completed':esc(t.priority||'Normal priority')}</span><button class="ghost" onclick="deleteTask(${idx})">Delete</button></div></div>`}
function openModal(html){$("#modalBody").innerHTML=html;$("#modal").classList.add("show")}function closeModal(){$("#modal").classList.remove("show")}
function openGrade(s="ELA"){openModal(`<h2>Update a grade</h2><label>Class</label><select id="gsub">${subjects.map(([x])=>`<option ${x===s?'selected':''}>${x}</option>`).join("")}</select><label>Grade (letter or percentage)</label><input id="gval" placeholder="Example: 92% or A-"><div class="actions"><button onclick="saveGrade()">Save grade</button></div>`)}
function saveGrade(){let s=$("#gsub").value,v=$("#gval").value.trim();if(!v)return;data.grades[s]={grade:v};save();closeModal();render()}
function openTask(){openModal(`<h2>Add assignment</h2><label>Assignment name</label><input id="ttitle" placeholder="Chapter 4 worksheet"><div class="formgrid"><div><label>Class</label><select id="tsub">${subjects.map(([s])=>`<option>${s}</option>`).join("")}</select></div><div><label>Due date</label><input id="tdue" type="date"></div><div class="full"><label>Priority</label><select id="tpriority"><option>Normal priority</option><option>High priority</option><option>Low priority</option></select></div><div class="full"><label>Details (optional)</label><textarea id="tdetails" placeholder="What do you need to do?"></textarea></div></div><div class="actions"><button onclick="saveTask()">Save assignment</button></div>`)}
function saveTask(){let title=$("#ttitle").value.trim();if(!title)return;data.tasks.push({title,subject:$("#tsub").value,due:$("#tdue").value,priority:$("#tpriority").value,details:$("#tdetails").value,done:false});save();closeModal();render();scheduleCheck()}
function toggleTask(i,v){let was=data.tasks[i].done;data.tasks[i].done=v;if(v&&!was&&!data.tasks[i].xpAwarded){awardWork();data.tasks[i].xpAwarded=true;}save();render()}
function awardWork(){let today=new Date().toISOString().slice(0,10);if(!data.workDays)data.workDays=[];if(!data.workDays.includes(today)){let y=new Date();y.setDate(y.getDate()-1);let yesterday=y.toISOString().slice(0,10);data.streak=data.lastWorkDay===yesterday?(data.streak||0)+1:1;data.lastWorkDay=today;data.bestStreak=Math.max(data.bestStreak||0,data.streak);data.workDays.push(today);}data.xp=(data.xp||0)+20;}function deleteTask(i){data.tasks.splice(i,1);save();render()}
function openNote(){openModal(`<h2>New class note</h2><label>Title</label><input id="ntitle" placeholder="German vocabulary"><label>Class</label><select id="nsub">${subjects.map(([s])=>`<option>${s}</option>`).join("")}</select><label>Notes</label><textarea id="nbody" placeholder="Write your notes..."></textarea><div class="actions"><button onclick="saveNote()">Save note</button></div>`)}
function saveNote(){let title=$("#ntitle").value.trim(),body=$("#nbody").value.trim();if(!title||!body)return;data.notes.push({title,subject:$("#nsub").value,body});save();closeModal();render()}function deleteNote(i){data.notes.splice(i,1);save();render()}
function changeMonth(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}render()}
function previewImage(e){let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);$("#imagePreview").innerHTML=`<div class="item" style="margin-top:10px"><p>Screenshot selected: ${esc(f.name)}</p><img src="${url}" alt="Grade screenshot preview" style="max-width:100%;max-height:280px;object-fit:contain;border-radius:10px;margin-top:8px"><p style="margin-top:8px">Reading text from screenshot…</p><div id="ocrStatus" class="muted small">Loading image text reader…</div><textarea id="ocrText" placeholder="Recognized text will appear here"></textarea><p class="muted small">Check the extracted text carefully. OCR can misread grades; use it as a draft, not an official record.</p></div>`;runOCR(f)}
async function ask(q){let question=q||$("#question").value.trim();if(!question)return;let endpoint=localStorage.getItem("schoolhub_ai_endpoint");if(endpoint){$("#answer").innerHTML='<div class="item">Connecting to your AI service…</div>';try{let r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:question,grades:data.grades,assignments:data.tasks})});if(!r.ok)throw new Error("Request failed");let j=await r.json();$("#answer").innerHTML='<div class="item"><b>AI Helper</b><p style="white-space:pre-wrap;line-height:1.6;margin-top:8px">'+esc(j.reply||j.answer||"The AI service returned no reply.")+'</p></div>';return}catch(e){$("#answer").innerHTML='<div class="item">Could not reach that AI endpoint. Check the URL and server setup. Showing the built-in planner answer instead.</div>';}}let tasks=upcoming(),answer="";let lower=question.toLowerCase();if(lower.includes("first")||lower.includes("week")||lower.includes("plan")){answer=tasks.length?"Start with your earliest due assignment: <b>"+esc(tasks[0].title)+"</b> for "+esc(tasks[0].subject)+(tasks[0].due?" (due "+esc(tasks[0].due)+")":"")+". Then choose one smaller task and take a short break between subjects.":"You have no saved assignments yet. Add the homework and due dates you know, and I can help sort them."}else if(lower.includes("coming")||lower.includes("upcoming")){answer=tasks.length?tasks.slice(0,6).map(t=>"• "+esc(t.title)+" — "+esc(t.subject)+(t.due?", due "+esc(t.due):"")).join("<br>"):"No upcoming assignments saved."}else if(lower.includes("grade")){answer=subjects.map(([s])=>s+": "+esc(gradeVal(s))).join("<br>")}else{answer="I can help you organize your saved assignments. Try asking what is due soon, what to work on first, or to show your grades. You can also add a task in the Assignment Book."}$("#answer").innerHTML=`<div class="item"><b>School Helper</b><p style="margin-top:8px;line-height:1.6">${answer}</p></div>`}
function saveAIEndpoint(){let v=$("#aiEndpoint").value.trim();if(v)localStorage.setItem("schoolhub_ai_endpoint",v);else localStorage.removeItem("schoolhub_ai_endpoint");alert("AI endpoint setting saved.");}
async function enableNotifications(){if(!("Notification" in window)){alert("This browser does not support notifications.");return}let p=await Notification.requestPermission();alert(p==="granted"?"Notifications are enabled while this app is open. Keep the app open for in-app reminder checks.":"Notifications were not enabled. You can still use the assignment list and calendar.");}
$("#notifyBtn").addEventListener("click",enableNotifications);
function scheduleCheck(){if(!("Notification" in window)||Notification.permission!=="granted")return;let today=new Date().toISOString().slice(0,10);let due=data.tasks.filter(t=>!t.done&&t.due===today);let key="schoolhub_notified_"+today;if(due.length&&!sessionStorage.getItem(key)){new Notification("School Hub: due today",{body:due.map(t=>t.title).join(", ")});sessionStorage.setItem(key,"1");}}
setInterval(scheduleCheck,60000);

async function runOCR(file){
 const status=$("#ocrStatus"), box=$("#ocrText");
 try{
  status.textContent="Starting text recognition…";
